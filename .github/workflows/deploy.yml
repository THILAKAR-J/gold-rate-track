name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  # 12:20 PM IST, Monday to Saturday: just after the IBJA noon benchmark.
  schedule:
    - cron: '50 6 * * 1-6'
  # Actions → Build and deploy → Run workflow: type today's rates (per gram, rupees). Leave blank to just rebuild.
  workflow_dispatch:
    inputs:
      gold_24k: { description: '24K per gram today (e.g. 14329)', required: false }
      gold_22k: { description: '22K per gram today (e.g. 13135)', required: false }
      gold_18k: { description: '18K per gram today (e.g. 10747)', required: false }
      silver_kg: { description: 'Silver per kg (needed the first time, optional after)', required: false }
      ibja_24k: { description: 'IBJA 999 per gram (optional, defaults to 24K)', required: false }
      yesterday: { description: "Yesterday 24K/22K/18K, e.g. 14200/13017/10650 (first time only)", required: false }
      cities: { description: 'Cities with their own rate, 24K/22K/18K: chennai=14329/13135/10750; mumbai=...', required: false }
      date: { description: 'Rate date YYYY-MM-DD (blank = today, IST)', required: false }
      note: { description: 'One-line note shown on the home page (optional)', required: false }

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update rates from feed (only if RATES_FEED_URL secret is set)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.gold_24k == '')
        env:
          RATES_FEED_URL: ${{ secrets.RATES_FEED_URL }}
          RATES_FEED_TOKEN: ${{ secrets.RATES_FEED_TOKEN }}
        run: |
          node scripts/update-rates.mjs
          if ! git diff --quiet data/rates.json; then
            git config user.name "rates-bot"
            git config user.email "rates-bot@users.noreply.github.com"
            git commit -am "Update rates for $(node -p "require('./data/rates.json').date")"
            git push
          fi

      - name: Save rates typed into the Run workflow form
        if: github.event_name == 'workflow_dispatch' && inputs.gold_24k != ''
        env:
          RATE_DATE: ${{ inputs.date }}
          GOLD_24K: ${{ inputs.gold_24k }}
          GOLD_22K: ${{ inputs.gold_22k }}
          GOLD_18K: ${{ inputs.gold_18k }}
          SILVER_KG: ${{ inputs.silver_kg }}
          IBJA_24K: ${{ inputs.ibja_24k }}
          YESTERDAY: ${{ inputs.yesterday }}
          CITIES: ${{ inputs.cities }}
          NOTE: ${{ inputs.note }}
        run: |
          node scripts/manual-rates.mjs
          if ! git diff --quiet data/rates.json; then
            git config user.name "rates-bot"
            git config user.email "rates-bot@users.noreply.github.com"
            git commit -am "Rates for $(node -p "require('./data/rates.json').date") (entered by hand)"
            git push
          fi

      - name: Read Pages settings
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url || 'http://localhost:4173' }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_INDEX: ${{ vars.SITE_INDEX }}
          ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
        run: node build.mjs

      - name: SEO and quality checks (titles, descriptions, canonicals, hreflang, schema, sitemap, links)
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url || 'http://localhost:4173' }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_INDEX: ${{ vars.SITE_INDEX }}
        run: node scripts/check.mjs

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
